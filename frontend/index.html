<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OptiStratixAI: Human-in-the-Loop Multi-Agentic RAG for Smarter Digital Marketing</title>
    <meta
      name="description"
      content="OptiStratixAI scrapes and analyses competitor landing pages and social media, surfaces strategic gaps, and turns them into evidence-based marketing strategy documents, with a human validating every major step."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so the theme never flashes on load.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('optistratix-theme') || 'null')
          var mode = stored && stored.state && stored.state.mode
          if (!mode || mode === 'system') {
            mode = 'light'
          }
          document.documentElement.setAttribute('data-theme', mode)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
